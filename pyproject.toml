[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm_safety"
version = "0.0.0"
description = "Tools and experiments for VLM safety analysis (ShiftDC pipeline)"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pillow>=10.0",
    "tqdm>=4.66",

    "torch==2.10.0",
    "torchvision==0.25.0",
    "tiktoken>=0.12.0",
    "sentencepiece>=0.2.1",
    "protobuf>=7.34.1",
    "einops>=0.8",
    "timm>=1.0",
    "flash-attn>=2.5",

    "transformers>=4.45",
    "transformers_stream_generator>=0.0.4",
    "accelerate>=1.0",
    "huggingface_hub>=0.25",
    "datasets>=3.0",
    "safetensors>=0.4",

    "anthropic>=0.40",
    "openai>=1.50",
    "together>=1.3",
    "python-dotenv>=1.0",
]

[tool.setuptools]
# Include package data and use src layout if desired; keep default minimal config.

[tool.setuptools.packages.find]
where = ["src"]
