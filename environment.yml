name: vlm_hallucination_mitigation

# ─────────────────────────────────────────────────────────────────────────────
# VLM Hallucination Mitigation — reproducible conda environment
# Adapted from the vlm_safety env for lambdab2.
# Last adapted: June 2026
#
# Target machine: lambdab2
#   - 4x NVIDIA RTX A6000 (48 GB), Ampere (sm_86)
#   - Driver 535.129.03, system CUDA 12.2 (nvcc 12.2.140)
#   - No sudo; install everything inside this conda prefix.
#
# Target models (unchanged from vlm_safety):
#   LLaVA-1.5-7B            (llava-hf/llava-1.5-7b-hf)
#   ShareGPT4V-7B           (Lin-Chen/ShareGPT4V-7B)
#   MiniGPT-4               (Vision-CAIR/MiniGPT-4, requires external repo)
#   Qwen-VL-Chat            (Qwen/Qwen-VL-Chat)
#   Qwen2-VL-7B-Instruct    (Qwen/Qwen2-VL-7B-Instruct)
#   Qwen2-VL-7B             (Qwen/Qwen2-VL-7B, base)
#   InternVL2-8B            (OpenGVLab/InternVL2-8B)
#   InternVL2.5-8B-MPO      (OpenGVLab/InternVL2_5-8B-MPO)
#
# ─────────────────────────────────────────────────────────────────────────────
# CHANGES FROM vlm_safety (all and only the lambdab2-relevant edits):
#
#   1. env renamed: vlm_safety -> vlm_hallucination_mitigation
#
#   2. torch CUDA index: cu124 -> cu121
#      The cu124 pin existed for RTX 50xx (Blackwell). lambdab2 is Ampere
#      (A6000, sm_86) on a 535 / CUDA 12.2 driver. cu121 wheels are the
#      safest match: >= nothing the driver can't run, and well-tested on
#      Ampere. If a given torch version lacks a cu121 wheel, fall back to the
#      cu124 line below (minor-version compat should still hold on driver 535).
#
#   3. flash-attn: removed entirely (was never actually required; the prior
#      env ran without it). LLaVA / Qwen fall back to sdpa automatically.
#      InternVL2 / InternVL2.5 default to use_flash_attn=True and must be
#      loaded with use_flash_attn=False (set the flag in the model config at
#      load time) — see note at the bottom of this file.
#      For interpretability work, sdpa/eager is preferable anyway: fused
#      flash kernels do not expose attention weights.
#
#   4. cache redirects (NOT in the yaml; set in your shell / setup script):
#         export HF_HOME=/data/romanus/huggingface
#         export WANDB_DIR=/data/romanus/wandb
#      Home is on the shared 3.5TB OS disk; /data is the dedicated 3.5TB SSD.
#      Keep model weights and run logs off home.
#
# Everything else (numpy/transformers/tokenizers/etc. pins) is unchanged and
# carries over verbatim — that pinning is hardware-independent.
# ─────────────────────────────────────────────────────────────────────────────
# Build directly with:
#   conda env create -f environment.yml
# (No companion script needed now that flash-attn is gone.)
# ─────────────────────────────────────────────────────────────────────────────

channels:
  - conda-forge

dependencies:
  # ── Python ─────────────────────────────────────────────────────────────────
  # 3.12: de facto standard for ML research as of early 2026.
  # MUST NOT be 3.13 or 3.14: several compiled CUDA extensions are not yet
  # stable on those versions. 3.12.7 is a well-tested patch release.
  - python=3.12.7

  - pip

  # libstdcxx-ng: ensures GLIBCXX ABI >= 3.4.30 in the conda prefix.
  # Compiled extensions (triton, etc.) link against libstdc++ at build time;
  # without this you get "version GLIBCXX_3.4.30 not found" at import time on
  # machines where the system libstdc++ is older. lambdab2 is Ubuntu 20.04,
  # whose system libstdc++ is old enough that this matters — keep it.
  - libstdcxx-ng

  # ── Scientific stack (conda-managed) ───────────────────────────────────────
  # conda-managed so numpy's C-extension ABI is consistent with scipy/sklearn.
  # Mixing conda numpy and pip numpy is a known source of segfaults.

  # PINNED to 1.26.4, NOT numpy 2.x:
  #   numpy 2.0 removed np.string_, np.bool, np.int, np.float, np.complex,
  #   np.object, np.str, changed casting rules, and broke several compiled
  #   packages (torchvision ops, some HF tokenizer backends, parts of timm).
  #   1.26.4 is the last LTS-style 1.x release.
  - numpy=1.26.4

  - scipy=1.13.1
  - scikit-learn=1.5.2
  - matplotlib=3.9.4
  - pillow=10.4.0
  - tqdm=4.66.6
  - pandas=2.2.3

  # ── pip-managed packages ────────────────────────────────────────────────────
  - pip:
      # ── PyTorch CUDA index ──────────────────────────────────────────────────
      # cu121 for Ampere (A6000) on driver 535 / CUDA 12.2. See change note 2.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      #
      # Fallback if torch==2.10.0 has no cu121 wheel at build time — comment the
      # line above and uncomment this one:
      # - --extra-index-url https://download.pytorch.org/whl/cu124

      # ── PyTorch core ────────────────────────────────────────────────────────
      # Pin all three companion packages together. Mismatched minor versions
      # cause silent CUDA kernel mismatches and operator registration errors.
      - torch==2.10.0
      - torchvision==0.25.0
      - torchaudio==2.10.0     # pin even if unused; prevents version drift via
                               # transitive deps

      # ── HuggingFace stack ───────────────────────────────────────────────────
      # transformers 4.50.1: pin chosen to satisfy ALL models.
      #   LLaVA-1.5-7B           requires >= 4.37.0
      #   InternVL2-8B           requires >= 4.37.2  [trust_remote_code]
      #   InternVL2.5-8B-MPO     requires >= 4.37.2  [trust_remote_code]
      #   Qwen2.5-VL-7B-Instruct requires >= 4.49.0  ← BINDING lower bound
      # Staying on 4.5x avoids the transformers v5 rewrite, which changed
      # output_hidden_states handling for several model classes — changes that
      # would silently affect activation extraction in probing scripts.
      - transformers==4.50.1

      # tokenizers MUST match transformers. A mismatch causes silent encoding
      # errors (wrong token IDs) that are very hard to trace.
      - tokenizers==0.21.0

      # accelerate: required for device_map="auto" on all models.
      - accelerate==1.3.0

      - huggingface_hub==0.27.1
      - datasets==3.1.0
      - safetensors==0.4.5

      # ── Model-specific utilities ────────────────────────────────────────────
      # transformers_stream_generator: required by Qwen-VL-Chat remote modeling
      # code (trust_remote_code=True). Not needed for Qwen2-VL.
      - transformers_stream_generator==0.0.5

      # qwen-vl-utils: required by Qwen2.5-VL for image/video preprocessing
      # (process_vision_info).
      - qwen-vl-utils==0.0.8

      # einops: required by InternVL2 attention ops (rearrange in ViT/projector).
      - einops==0.8.1

      # timm: vision backbone utilities used by InternVL2's ViT components.
      - timm==1.0.12

      # ── LLM API clients ─────────────────────────────────────────────────────
      # Used for the two-axis LLM judge (claude-sonnet) and any OpenAI calls.
      - anthropic==0.40.0
      - openai==1.50.0
      - python-dotenv==1.0.1

      # tiktoken: required by Anthropic/OpenAI clients for token counting.
      - tiktoken==0.7.0

      # ── Tokenizer support ───────────────────────────────────────────────────
      - sentencepiece==0.2.0

      # protobuf PINNED to 4.25.5: protobuf 5+ has breaking .proto API changes
      # affecting HF tokenizer backends (SentencePiece-based models). 4.25.x is
      # the tested-compatible target for transformers 4.50.x.
      - protobuf==4.25.5
      - pytest==9.1.0