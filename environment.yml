name: cloudspace

# ─────────────────────────────────────────────────────────────────────────────
# VLM Safety — reproducible conda environment
# Last verified: April 2026
# Target models:
#   LLaVA-1.5-7B            (llava-hf/llava-1.5-7b-hf)
#   ShareGPT4V-7B           (Lin-Chen/ShareGPT4V-7B)
#   MiniGPT-4               (Vision-CAIR/MiniGPT-4, requires external repo)
#   Qwen-VL-Chat            (Qwen/Qwen-VL-Chat)
#   Qwen2-VL-7B-Instruct    (Qwen/Qwen2-VL-7B-Instruct)
#   Qwen2-VL-7B             (Qwen/Qwen2-VL-7B, base)
#   InternVL2-8B             (OpenGVLab/InternVL2-8B)
#   InternVL2.5-8B-MPO       (OpenGVLab/InternVL2_5-8B-MPO)
# Hardware: RTX 5080 (16 GB) / RTX 5090 (32 GB), fp16
# ─────────────────────────────────────────────────────────────────────────────
# DO NOT use `conda env create -f environment.yml` directly.
# Use the companion setup script instead:
#   bash setup_env.sh
# flash-attn requires a separate post-install step that the script handles.
# ─────────────────────────────────────────────────────────────────────────────

channels:
  - conda-forge

dependencies:
  # ── Python ─────────────────────────────────────────────────────────────────
  # 3.12: de facto standard for ML research as of early 2026.
  # MUST NOT be 3.13 or 3.14: flash-attn and several compiled CUDA extensions
  # are not yet stable on those versions. 3.12.7 is a well-tested patch release.
  - python=3.12.7

  - pip

  # libstdcxx-ng: ensures GLIBCXX ABI >= 3.4.30 in the conda prefix.
  # flash-attn, triton, and other compiled extensions link against libstdc++
  # at build time; without this, you get "version GLIBCXX_3.4.30 not found"
  # errors at import time on machines where the system libstdc++ is older.
  - libstdcxx-ng

  # ── Scientific stack (conda-managed) ───────────────────────────────────────
  # Installed via conda rather than pip so that numpy's C-extension ABI is
  # consistent with scipy, scikit-learn, and any other compiled packages.
  # Mixing conda numpy and pip numpy is a known source of segfaults.

  # PINNED to 1.26.4, NOT numpy 2.x:
  #   numpy 2.0 removed np.string_, np.bool, np.int, np.float, np.complex,
  #   np.object, np.str, changed casting rules, and broke several compiled
  #   packages. torchvision ops, some HuggingFace tokenizer backends, and
  #   parts of timm are affected. 1.26.4 is the last LTS-style 1.x release.
  - numpy=1.26.4

  - scipy=1.13.1
  - scikit-learn=1.5.2
  - matplotlib=3.9.4
  - pillow=10.4.0
  - tqdm=4.66.6
  - pandas=2.2.3

  # ── pip-managed packages ────────────────────────────────────────────────────
  - pip:
      # ── PyTorch CUDA index ──────────────────────────────────────────────────
      # --extra-index-url adds the PyTorch wheel server alongside PyPI.
      # cu124 = CUDA 12.4, which is the most stable wheel set for RTX 50xx
      # (Blackwell) as of early 2026. All three torch packages must come from
      # the same index to share CUDA runtime libs.
      #
      # To use CUDA 12.8 wheels instead (also supported on 50xx), change to:
      #   --extra-index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://download.pytorch.org/whl/cu128

      # ── PyTorch core ────────────────────────────────────────────────────────
      # Always pin all three companion packages together. Mismatching minor
      # versions (e.g. torch 2.10 + torchvision 0.24) causes silent CUDA
      # kernel mismatches and operator registration errors.
      - torch==2.10.0
      - torchvision==0.25.0
      - torchaudio==2.10.0     # pin even if unused; prevents version drift via
                                # transitive deps

      # ── HuggingFace stack ───────────────────────────────────────────────────
      # transformers 4.50.1: specific pin chosen to satisfy ALL four models.
      #
      #   LLaVA-1.5-7B           requires >= 4.37.0
      #     (LlavaForConditionalGeneration added 4.36/4.37)
      #   InternVL2-8B            requires >= 4.37.2  [trust_remote_code]
      #   InternVL2.5-8B-MPO      requires >= 4.37.2  [trust_remote_code]
      #   Qwen2.5-VL-7B-Instruct  requires >= 4.49.0  ← BINDING lower bound
      #     (Qwen2_5_VLForConditionalGeneration merged 2025-01-23)
      #
      # Staying on 4.5x rather than 5.x avoids the transformers v5 rewrite,
      # which dropped TF/JAX backends and changed output_hidden_states
      # handling for several model classes — changes that would silently affect
      # activation extraction in your probing scripts.
      - transformers==4.50.1

      # tokenizers MUST be pinned to match transformers. A version mismatch
      # causes silent encoding errors (wrong token IDs) that are very hard
      # to trace back to the root cause.
      - tokenizers==0.21.0

      # accelerate: required for device_map="auto" on all four models.
      - accelerate==1.3.0

      - huggingface_hub==0.27.1
      - datasets==3.1.0
      - safetensors==0.4.5

      # ── Flash Attention 2 ───────────────────────────────────────────────────
      # NOTE: flash-attn is intentionally NOT listed here.
      # It requires compilation against the installed torch headers and cannot
      # always find a prebuilt wheel from PyPI. Installing it inside
      # `conda env create` frequently fails silently or produces an
      # incompatible build.
      #
      # The companion setup_env.sh installs it correctly after env creation:
      #   pip install flash-attn==2.7.4 --no-build-isolation
      #
      # InternVL2-8B and InternVL2.5-8B-MPO call use_flash_attn=True by default
      # and will raise at load time without it. LLaVA and Qwen2.5-VL use it
      # for speedup but fall back to sdpa if absent.

      # ── Model-specific utilities ────────────────────────────────────────────
      # transformers_stream_generator: required by Qwen-VL-Chat's remote
      # modeling code (trust_remote_code=True). Not needed for Qwen2-VL.
      - transformers_stream_generator==0.0.5

      # qwen-vl-utils: required by Qwen2.5-VL for image/video preprocessing
      # (process_vision_info). Not needed for the base VL model but include
      # for consistency.
      - qwen-vl-utils==0.0.8

      # einops: required by InternVL2 attention operations (rearrange calls
      # in the ViT and MLP projector).
      - einops==0.8.1

      # timm: vision backbone utilities used by InternVL2's ViT components.
      - timm==1.0.12

      # ── LLM API clients ─────────────────────────────────────────────────────
      # Used for the two-axis LLM judge (claude-sonnet) and any OpenAI calls.
      - anthropic==0.40.0
      - openai==1.50.0
      - python-dotenv==1.0.1

      # tiktoken: required by the Anthropic and OpenAI clients for token counting.
      - tiktoken==0.7.0

      # ── Tokenizer support ───────────────────────────────────────────────────
      - sentencepiece==0.2.0

      # protobuf PINNED to 4.25.5:
      #   - protobuf 5+ has breaking .proto API changes that affect HuggingFace
      #     tokenizer backends (SentencePiece-based models).
      #   - The version in the original environment.yml (>=7.34.1) does not
      #     exist on PyPI; latest stable series is 4.x/5.x.
      #   - 4.25.x is the tested-compatible target for transformers 4.50.x.
      - protobuf==4.25.5